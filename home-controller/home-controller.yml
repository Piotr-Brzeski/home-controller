targetTemplates:
  link-coap:
    settings:
      OTHER_LDFLAGS:
        - -lcoap-3-openssl
        - -lssl
  link-mosquitto:
    settings:
      OTHER_LDFLAGS:
        - -lmosquitto
targets:
  home-controller:
    platform: macOS
    type: tool
    templates:
      - include-curl-ws
      - link-curl-ws
      - link-coap
      - link-mosquitto
    dependencies:
      - target: home-link
        link: true
      - target: cpp-ikea
        link: true
      - target: cpp-coap
        link: true
      - target: cpp-network
        link: true
      - target: data-format
        link: true
      - target: cpp-log
        link: true
    settings:
      HEADER_SEARCH_PATHS:
        - /opt/homebrew/include
        - ${SRCROOT}/home-link
        - ${SRCROOT}/cpp-ikea
        - ${SRCROOT}/cpp-network
        - ${SRCROOT}/cpp-data-format
        - ${SRCROOT}/cpp-log
      LIBRARY_SEARCH_PATHS:
        - /opt/homebrew/lib
      _LINUX_OTHER_LDFLAGS:
        -lcoap-3-gnutls
        -lcurl
    sources:
      - path: bulbs_group.cpp
        group: home-controller
      - path: bulbs_group.h
        group: home-controller
        buildPhase: none
      - path: commands_queue.cpp
        group: home-controller
      - path: commands_queue.h
        group: home-controller
        buildPhase: none
      - path: configuration.cpp
        group: home-controller
      - path: configuration.h
        group: home-controller
        buildPhase: none
      - path: controller.cpp
        group: home-controller
      - path: controller.h
        group: home-controller
        buildPhase: none
      - path: curl_connection.cpp
        group: home-controller
      - path: curl_connection.h
        group: home-controller
        buildPhase: none
      - path: device.h
        group: home-controller
        buildPhase: none
      - path: dirigera_system.cpp
        group: home-controller
      - path: dirigera_system.h
        group: home-controller
        buildPhase: none
      - path: exception.h
        group: home-controller
        buildPhase: none
      - path: http_connection.cpp
        group: home-controller
      - path: http_connection.h
        group: home-controller
        buildPhase: none
      - path: homekit_controller.cpp
        group: home-controller
      - path: homekit_controller.h
        group: home-controller
        buildPhase: none
      - path: home-controller.cpp
        group: home-controller
      - path: json.h
        group: home-controller
        buildPhase: none
      - path: mqtt.cpp
        group: home-controller
      - path: mqtt.h
        group: home-controller
        buildPhase: none
      - path: mqtt_queue.cpp
        group: home-controller
      - path: mqtt_queue.h
        group: home-controller
        buildPhase: none
      - path: mqtt_system.cpp
        group: home-controller
      - path: mqtt_system.h
        group: home-controller
        buildPhase: none
      - path: switches_controller.cpp
        group: home-controller
      - path: switches_controller.h
        group: home-controller
        buildPhase: none
      - path: single_outlet.h
        group: home-controller
        buildPhase: none
      - path: system_base.h
        group: home-controller
        buildPhase: none
      - path: systems.cpp
        group: home-controller
      - path: systems.h
        group: home-controller
        buildPhase: none
      - path: ws_connection.cpp
        group: home-controller
      - path: ws_connection.h
        group: home-controller
        buildPhase: none

